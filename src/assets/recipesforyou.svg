<svg width="300" height="300" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the pot -->
    <linearGradient id="potGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D84315;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for steam -->
    <linearGradient id="steamGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF5E1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Gradient for background circle -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFECB3;stop-opacity:1" />
    </radialGradient>
    
    <!-- Filter for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradient)"/>
  
  <!-- Outer decorative circle -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#FFB74D" stroke-width="2" opacity="0.4"/>
  
  <!-- Cooking pot body -->
  <path d="M 120 200 Q 120 240 140 260 L 260 260 Q 280 240 280 200 L 280 180 L 120 180 Z" 
        fill="url(#potGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Pot rim/lid holder -->
  <rect x="110" y="170" width="180" height="12" rx="6" fill="#BF360C"/>
  <rect x="115" y="173" width="170" height="6" rx="3" fill="#D84315" opacity="0.6"/>
  
  <!-- Pot handles -->
  <path d="M 100 185 Q 90 185 85 195 Q 85 205 95 210" 
        fill="none" 
        stroke="#8D6E63" 
        stroke-width="8" 
        stroke-linecap="round"/>
  <path d="M 300 185 Q 310 185 315 195 Q 315 205 305 210" 
        fill="none" 
        stroke="#8D6E63" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Steam wisps -->
  <g opacity="0.9">
    <path d="M 170 165 Q 165 145 170 125 Q 175 105 165 90" 
          fill="none" 
          stroke="url(#steamGradient)" 
          stroke-width="12" 
          stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -3,-5; 0,0" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 200 160 Q 210 140 205 115 Q 200 90 210 70" 
          fill="none" 
          stroke="url(#steamGradient)" 
          stroke-width="14" 
          stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,-6; 0,0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 230 165 Q 240 145 235 120 Q 230 100 240 85" 
          fill="none" 
          stroke="url(#steamGradient)" 
          stroke-width="11" 
          stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Spoon in pot -->
  <g transform="translate(245, 200) rotate(25)">
    <ellipse cx="0" cy="-8" rx="10" ry="13" fill="#ECEFF1"/>
    <rect x="-2" y="0" width="4" height="35" rx="2" fill="#B0BEC5"/>
    <ellipse cx="0" cy="-8" rx="7" ry="10" fill="#CFD8DC" opacity="0.6"/>
  </g>
  
  <!-- Decorative food elements on pot -->
  <g opacity="0.3">
    <circle cx="150" cy="210" r="4" fill="#FFF"/>
    <circle cx="180" cy="225" r="3" fill="#FFF"/>
    <circle cx="220" cy="215" r="4" fill="#FFF"/>
    <circle cx="250" cy="230" r="3" fill="#FFF"/>
  </g>
  
  <!-- Text: Recipes4you -->
  <text x="200" y="310" 
        font-family="'Georgia', serif" 
        font-size="38" 
        font-weight="bold" 
        fill="#D84315" 
        text-anchor="middle"
        letter-spacing="1">Recipes</text>
  
  <text x="200" y="340" 
        font-family="'Georgia', serif" 
        font-size="32" 
        font-weight="600" 
        fill="#FF6B35" 
        text-anchor="middle"
        letter-spacing="2">4you</text>
  
  <!-- Small subtitle decoration -->
  <line x1="140" y1="350" x2="260" y2="350" stroke="#FFB74D" stroke-width="2" opacity="0.5"/>
</svg>